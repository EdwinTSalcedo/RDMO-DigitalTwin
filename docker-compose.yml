services:
  yolo-backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: rdmo-yolo-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - MODEL_PATH=/app/models/model_finetuned.pt
      - DETECTIONS_DIR=/app/detections
    volumes:
      - ./detections_output:/app/detections
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 1G
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  web-frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    container_name: rdmo-web-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      yolo-backend:
        condition: service_healthy

networks:
  default:
    name: rdmo-network
