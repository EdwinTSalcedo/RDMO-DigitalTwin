server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html/simulator-web;
    index index.html;

    # Enable native gzip and gzip_static for Unity WebGL compressed files (.gz)
    gzip on;
    gzip_static on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript application/wasm;
    gzip_min_length 1000;

    # Unity WebGL MIME types
    types {
        text/html                             html htm shtml;
        text/css                              css;
        text/xml                              xml;
        image/gif                             gif;
        image/jpeg                            jpeg jpg;
        application/javascript                js;
        application/json                      json;
        application/wasm                      wasm;
        application/octet-stream              data symbols.json unityweb;
        image/png                             png;
        image/svg+xml                         svg svgz;
        video/mp4                             mp4;
    }

    # Specific headers for pre-gzipped Unity WebGL files ending in .gz
    location ~ \.wasm\.gz$ {
        gzip off;
        types {}
        default_type application/wasm;
        add_header Content-Encoding gzip always;
    }

    location ~ \.data\.gz$ {
        gzip off;
        types {}
        default_type application/octet-stream;
        add_header Content-Encoding gzip always;
    }

    location ~ \.js\.gz$ {
        gzip off;
        types {}
        default_type application/javascript;
        add_header Content-Encoding gzip always;
    }

    # Proxy API requests to Python YOLO Backend
    location ^~ /api/ {
        proxy_pass http://yolo-backend:5000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 50M;
    }

    location /predict {
        proxy_pass http://yolo-backend:5000/predict;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 50M;
    }

    # Serve Unity WebGL simulator app by default
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri $uri/ =404;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
